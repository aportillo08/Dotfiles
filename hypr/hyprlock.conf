# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = cursive

general {
    hide_cursor = false
    screencopy_mode = 0
    immediate_render = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = overshot,       0.13, 0.99, 0.29, 1.1
    animation = fadeIn, 1, 8, easeInOutCubic
    animation = fadeOut, 1, 8, easeInOutCubic
    animation = inputFieldFade, 1, 6, almostLinear
    animation = inputFieldWidth, 1, 6, overshot
    animation = inputFieldDots, 1, 6, overshot
}

background {
    monitor =
    path = /home/snipermask/Fondos/16.png
    blur_passes = 3
    new_optimizations = true
    passes = 3
    brightness = 1
    noise = 0.05
    contrast = 0.89
    vibrancy = 0.5
    vibrancy_darkness = 0.5
    popups = false
    popups_ignorealpha = 0.6
    input_methods = true
    input_methods_ignorealpha = 0.8
}

input-field {
    monitor =
    size = 50%, 8%
    outline_thickness = 5
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(255,255,255,0.6);
    check_color = rgb(255, 255, 255);
    fail_color = rgba(255, 0, 0, 0.6);

    font_color = rgba(255, 255, 255, 0.5);
    fade_on_empty = true
    rounding = 50

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format = @
    dots_size = 0.6
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -40
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 120
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# USER
label {
    monitor =
    text = Hi there, $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 85
    font_family = $font

    position = 0, 80
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}