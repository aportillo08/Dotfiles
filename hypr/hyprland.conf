#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 12
    gaps_out = 25

    border_size = 0

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(a9b1d6ff)
    col.inactive_border = rgba(a9b1d6ff)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    snap {
        enabled = true
        window_gap = 4
        monitor_gap = 5
        respect_gaps = true
    }

    layout = scrolling
}

scrolling {
    fullscreen_on_one_column = true
    column_width = 0.9
    direction = down
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 0
        offset = 13 13
        render_power = 100
        color = rgba(000000ff)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
     blur {
        enabled = true
	xray = true
	special = false
        new_optimizations = true
        size = 10
        passes = 3
        brightness = 1
        noise = 0.05
        contrast = 0.89
        vibrancy = 0.5
        vibrancy_darkness = 0.5
        popups = false
        popups_ignorealpha = 0.6
        input_methods = true
        input_methods_ignorealpha = 0.8
    }

    layerrule = blur on, match:namespace waybar
    layerrule = blur on, match:namespace logout_dialog
    layerrule = ignore_alpha 0, match:namespace logout_dialog
    layerrule = blur on, match:namespace swaync-control-center
    layerrule = ignore_alpha 0, match:namespace swaync-control-center 
    layerrule = blur on, match:namespace swaync-notification-window
    layerrule = ignore_alpha 0, match:namespace swaync-notification-window

    # Dim
    dim_inactive = true
    dim_strength = 0.05
    dim_special = 0.2
}


# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = overshot,       0.13, 0.99, 0.29, 1.1
    bezier = easeOutExpo,    0.16, 1,    0.3,  1
    bezier = defaultBezier,  0.05, 0.9,  0.1,  1.05
    bezier = been,           0.24, 0.9,  0.25, 0.91
    bezier = slow,           0,    0.85, 0.3,  1
    bezier = easeInOutBack,  0.68,-0.6,  0.32, 1.6

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,          [STYLE]
    animation = border,        1,     12,    defaultBezier
    animation = borderangle,   1,     12,    defaultBezier
    animation = windows,       1,     18,    defaultBezier
    animation = windowsIn,     1,     12,    slow,           slide
    animation = windowsOut,    1,     50,    almostLinear,   slide
    animation = windowsMove,   1,      8,    default
    animation = fadeIn,        1,     12,    easeOutExpo
    animation = fadeOut,       1,     12,    easeOutExpo
    animation = layersIn,      1,     15,    easeInOutCubic, slide
    animation = layersOut,     1,     50,    almostLinear,   slide
    animation = fadeLayersIn,  1,     8,     slow
    animation = fadeLayersOut, 1,     8,     slow
    animation = workspaces,    1,     8,     default,        slide
    animation = zoomFactor,    1,     12,    overshot
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = false
    swallow_regex = (foot|kitty|allacritty|Alacritty)
    on_focus_under_fullscreen = 2
    allow_session_lock_restore = true
    session_lock_xray = true
    initial_workspace_tracking = false
    focus_on_activate = true
}

binds {
    scroll_event_delay = 0
    hide_special_on_workspace_change = true
}

cursor {
    zoom_factor = 1
    zoom_rigid = false
    zoom_disable_aa = true
    hotspot_padding = 1
    no_hardware_cursors = true
}

xwayland {
   enabled = true
}

#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us, es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    off_window_axis_events = 2

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.7
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, backspace, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen
bind = $mainMod, R, exec, $menu
bind = $mainMod, W, exec, waypaper
bind = $mainMod, C, exec, $clipboard
bind = $mainMod, O, exec, hyprshot -m region
bind = $mainMod, P, exec, wlogout
bind = $mainMod, L, exec, hyprlock
bind = $mainMod CTRL, left, exec, hyprctl --batch "dispatch movewindow l ; dispatch movewindow d"
bind = $mainMod CTRL, right, exec, hyprctl --batch "dispatch movewindow r ; dispatch movewindow u"
bind = $mainMod CTRL, up, swapwindow, u
bind = $mainMod CTRL, down, swapwindow, d
bindl=,switch:on:Lid Switch,exec,hyprctl dispatch dpms off
bindl=,switch:off:Lid Switch,exec,hyprctl dispatch dpms on

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,F5, exec, swayosd-client --output-volume raise
bindel = ,F4, exec, swayosd-client --output-volume lower --device alsa_output.pci-0000_11_00.4.analog-stereo.monitor
bindel = ,F3, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,F10, exec, swayosd-client --brightness raise
bindel = ,F9 , exec, swayosd-client --brightness lower

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

windowrule {
    name = sober-final
    match:class = Sober
    float = true
    center = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = waypaper-floating
    match:class = waypaper
    float = true
    center = true
}

windowrule {
    name = file-picker-center
    match:class = Xdg-desktop-portal-gtk
    float = true
    center = true
    size = 900 600
}

windowrule {
    name = pavucontrol-qt-floating
    match:class = pavucontrol-qt
    float = true
    center = true
}
